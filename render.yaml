services:
  # 1. FastAPI Backend (Web Service)
  - type: web
    name: insightai-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: insightai-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: UPLOAD_DIR
        value: uploads
      - key: AUTO_CREATE_TABLES
        value: "false"
      # Must match the deployed frontend origin (Vercel/Netlify)
      - key: CORS_ORIGINS
        value: https://frontend-nine-woad-19.vercel.app
      # Mark refresh-token cookie Secure (HTTPS only)
      - key: COOKIE_SECURE
        value: "true"
      # Rate-limit counters shared across instances (Render Redis requires paid tier;
      # memory:// is acceptable for a single free instance)
      - key: RATE_LIMIT_STORAGE
        value: memory://
      # Celery needs Redis. Render free tier has none, so keep async ETL inline
      # here; the docker-compose setup (with Redis) enables the Celery worker.
      - key: CELERY_ENABLED
        value: "false"
      # API version prefix (all routes are served under /api/v1)
      - key: API_V1_STR
        value: /api/v1

databases:
  - name: insightai-db
    plan: free
    databaseName: insightai
    user: insightai
