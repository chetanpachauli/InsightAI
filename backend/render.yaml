services:
  - type: web
    name: insightai-backend
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    # Run migrations before serving so schema stays in sync with Alembic
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://frontend-nine-woad-19.vercel.app
      - key: ENVIRONMENT
        value: production
      - key: DB_ECHO
        value: "false"
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: RATE_LIMIT_STORAGE
        value: memory://
      - key: CELERY_ENABLED
        value: "false"
      - key: API_V1_STR
        value: /api/v1
